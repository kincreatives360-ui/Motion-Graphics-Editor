kind = "web"
previewPath = "/"
title = "Motion Graphics Editor"
description = "An empty motion graphics editor interface recreated from the provided Raylight editor reference, with a dark canvas workspace, asset panel, timeline, toolbar, and project inspector."
version = "1.0.0"
id = "artifacts/motion-graphics-editor"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25470

[services.development]
run = "pnpm --filter @workspace/motion-graphics-editor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/motion-graphics-editor", "run", "build" ]
serve = "static"
publicDir = "artifacts/motion-graphics-editor/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25470"
BASE_PATH = "/"
